<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Train Live Map 京急線版</title>
  <desc id="description">
    公式ロゴを使わずに制作した、笑顔のオリジナル赤い電車アイコン
  </desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="944" y2="984">
      <stop offset="0" stop-color="#ef3551"/>
      <stop offset="0.58" stop-color="#cf102d"/>
      <stop offset="1" stop-color="#93001c"/>
    </linearGradient>
    <linearGradient id="train" x1="250" y1="150" x2="760" y2="640">
      <stop offset="0" stop-color="#ff4961"/>
      <stop offset="0.48" stop-color="#d91433"/>
      <stop offset="1" stop-color="#a40020"/>
    </linearGradient>
    <linearGradient id="window" x1="300" y1="235" x2="700" y2="485">
      <stop offset="0" stop-color="#f6fdff"/>
      <stop offset="1" stop-color="#ccecf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="16"
        stdDeviation="16"
        flood-color="#5d0014"
        flood-opacity="0.42"
      />
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="226" fill="url(#background)"/>
  <rect
    x="42"
    y="42"
    width="940"
    height="940"
    rx="208"
    fill="none"
    stroke="#fff5f3"
    stroke-opacity="0.72"
    stroke-width="10"
  />

  <g opacity="0.18" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M90 240 C240 116 342 94 492 86" stroke-width="18"/>
    <path d="M780 104 C894 190 932 262 956 382" stroke-width="10"/>
    <path d="M78 588 C124 662 166 702 248 744" stroke-width="8"/>
  </g>

  <g filter="url(#shadow)">
    <path
      d="M278 150 C278 116 306 88 340 88 H684 C718 88 746 116 746 150 V184 H278 Z"
      fill="#fff5f3"
    />
    <rect x="188" y="148" width="648" height="514" rx="154" fill="url(#train)"/>
    <rect
      x="234"
      y="202"
      width="556"
      height="314"
      rx="112"
      fill="#fff8f5"
      stroke="#8e001a"
      stroke-width="12"
    />
    <rect x="270" y="238" width="484" height="242" rx="84" fill="url(#window)"/>
    <path
      d="M314 246 H466 L400 470 H280 Z"
      fill="#fff"
      fill-opacity="0.34"
    />

    <circle cx="396" cy="344" r="24" fill="#2b1720"/>
    <circle cx="628" cy="344" r="24" fill="#2b1720"/>
    <circle cx="388" cy="336" r="8" fill="#fff"/>
    <circle cx="620" cy="336" r="8" fill="#fff"/>
    <path
      d="M430 404 C468 448 556 448 594 404"
      fill="none"
      stroke="#2b1720"
      stroke-width="17"
      stroke-linecap="round"
    />
    <ellipse cx="350" cy="406" rx="30" ry="17" fill="#ff8c9e" opacity="0.68"/>
    <ellipse cx="674" cy="406" rx="30" ry="17" fill="#ff8c9e" opacity="0.68"/>

    <rect x="258" y="532" width="508" height="78" rx="39" fill="#fff5f3"/>
    <circle cx="310" cy="571" r="23" fill="#ffd46b" stroke="#7f0018" stroke-width="8"/>
    <circle cx="714" cy="571" r="23" fill="#ffd46b" stroke="#7f0018" stroke-width="8"/>
    <rect x="408" y="548" width="208" height="46" rx="23" fill="#c70e2d"/>

    <path
      d="M218 640 H806 L764 704 H260 Z"
      fill="#fff5f3"
      stroke="#790018"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <circle cx="340" cy="678" r="42" fill="#30252a" stroke="#fff5f3" stroke-width="12"/>
    <circle cx="684" cy="678" r="42" fill="#30252a" stroke="#fff5f3" stroke-width="12"/>
  </g>

  <g>
    <rect
      x="88"
      y="720"
      width="848"
      height="230"
      rx="76"
      fill="#fff9f6"
      stroke="#820019"
      stroke-width="10"
    />
    <text
      x="512"
      y="814"
      text-anchor="middle"
      font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', sans-serif"
      font-size="76"
      font-weight="800"
      letter-spacing="-2"
      fill="#7f0019"
    >Train Live Map</text>
    <text
      x="512"
      y="890"
      text-anchor="middle"
      font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', sans-serif"
      font-size="62"
      font-weight="800"
      fill="#c90e2e"
    >京急線版</text>
    <text
      x="816"
      y="922"
      text-anchor="middle"
      font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', sans-serif"
      font-size="27"
      font-weight="700"
      fill="#7f0019"
    >非公式</text>
  </g>
</svg>
