# Firebase App Hosting / Cloud Run settings.
# The initial production rollout is intentionally mock-only. ODPT live data
# remains disabled until the Keikyu-specific Challenge 2026 terms are verified.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: ODPT_API_BASE_URL
    value: https://api-challenge.odpt.org/api/v4
    availability:
      - RUNTIME

  - variable: ODPT_LIVE_DATA_APPROVED
    value: "false"
    availability:
      - RUNTIME
